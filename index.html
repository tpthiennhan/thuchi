<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thu Chi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Thu Chi</title>
<meta name="standalone-build" content="1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f3ee">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ee; --card:#ffffff; --ink:#1d1c19; --muted:#7a776f; --line:#e6e3da; --soft:#efede6;
  --inc:#1d8a5a; --exp:#cf4436; --warn:#c98a12; --btn:#1d1c19; --btnInk:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#121210; --card:#1c1b19; --ink:#f2f0ea; --muted:#9c988e; --line:#2d2c28; --soft:#25241f;
    --inc:#43bd88; --exp:#ef6b5e; --warn:#e3a93a; --btn:#f2f0ea; --btnInk:#121210; --shadow:none; }
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Be Vietnam Pro",-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.4;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 110px) calc(env(safe-area-inset-left) + 14px)}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--ink);font-size:16px}
.wrap{max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);font-size:18px}
.month{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:6px;box-shadow:var(--shadow);margin-bottom:12px}
.month b{font-weight:600;font-size:16px}
.month button{width:40px;height:36px;border-radius:10px;font-size:20px;color:var(--muted)}
.month button:active{background:var(--soft)}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
.lbl{font-size:13px;color:var(--muted)}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:2px 0 14px;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{background:var(--soft);border-radius:14px;padding:10px 12px}
.pill .v{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.inc{color:var(--inc)} .exp{color:var(--exp)}
.budget{margin-top:14px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.small{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin:4px 0 12px}
.tabs button{flex:1;padding:8px 0;border-radius:10px;font-weight:500;color:var(--muted);font-size:14px}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.h{font-weight:600;font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:2px}
.seg button{padding:5px 12px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.donutwrap{display:flex;justify-content:center;margin:4px 0 10px}
.cat{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.cat:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.cat .nm{flex:1;min-width:0}
.cat .nm div:first-child{font-weight:500}
.mini{height:4px;border-radius:99px;background:var(--soft);margin-top:5px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:99px}
.amt{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pct{font-size:12px;color:var(--muted);font-weight:400}
.days{display:flex;align-items:flex-end;gap:2px;height:120px;margin-top:6px}
.days button{flex:1;height:100%;display:flex;align-items:flex-end}
.days button i{display:block;width:100%;border-radius:3px 3px 1px 1px;background:var(--exp);opacity:.55;min-height:2px}
.days button.today i{opacity:1}
.days button.sel i{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.days button.zero i{background:var(--line);opacity:1}
.daylbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.caption{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px}
.caption b{color:var(--ink);font-weight:600}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:14px 4px 6px}
.dayhead:first-child{margin-top:0}
.tx{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);width:100%;text-align:left;border-top:1px solid var(--line)}
.group{border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.group .tx:first-child{border-top:0}
.tx:active{background:var(--soft)}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--soft)}
.tx .nm{flex:1;min-width:0}
.tx .nm div:first-child{font-weight:500}
.tx .note{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filter{display:inline-flex;gap:8px;align-items:center;background:var(--card);border-radius:99px;padding:6px 8px 6px 12px;box-shadow:var(--shadow);font-size:13px;margin-bottom:12px}
.filter button{width:22px;height:22px;border-radius:50%;background:var(--soft);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty .e{font-size:34px;margin-bottom:6px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 22px);height:56px;padding:0 26px;border-radius:99px;background:var(--btn);color:var(--btnInk);font-weight:600;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.22);display:flex;align-items:center;gap:8px;z-index:5}
.fab span{font-size:24px;line-height:1;margin-top:-2px}
.note-banner{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.skel{height:120px;border-radius:20px;background:var(--card);opacity:.6;margin-bottom:12px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:22px 22px 0 0;
  padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:11;max-width:560px;margin:0 auto}
.sheet.show{transform:none}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.shead b{font-size:17px}
.shead button{color:var(--muted);font-size:15px;padding:6px}
.typeseg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:14px}
.typeseg button{flex:1;padding:9px 0;border-radius:10px;font-weight:600;color:var(--muted)}
.typeseg button.on.e{background:var(--exp);color:#fff}
.typeseg button.on.i{background:var(--inc);color:#fff}
.amtbox{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.amtbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:0}
.amtbox span{font-size:22px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{padding:7px 11px;border-radius:99px;background:var(--soft);font-size:13.5px;font-weight:500}
.chips button:active{background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.grid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border-radius:14px;background:var(--soft);font-size:12px;line-height:1.2;text-align:center;border:2px solid transparent}
.grid button .g{font-size:22px}
.grid button.on{border-color:var(--ink);background:var(--card)}
.field{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:4px 12px;margin-bottom:10px;min-height:48px}
.field label{font-size:13px;color:var(--muted);width:62px;flex:none}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:10px 0}
.sublbl{font-size:13px;color:var(--muted);margin:2px 0 8px}
.primary{width:100%;height:52px;border-radius:14px;background:var(--btn);color:var(--btnInk);font-weight:600;font-size:16px;margin-top:6px}
.danger{width:100%;height:46px;border-radius:14px;color:var(--exp);font-weight:600;margin-top:8px;background:var(--soft)}
.danger.confirm{background:var(--exp);color:#fff}
.err{color:var(--exp);font-size:13px;min-height:18px;margin:-4px 0 6px}
.setsec{margin-bottom:20px}
.setsec h4{margin:0 0 8px;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:99px;padding:6px 6px 6px 12px;font-size:13.5px;margin:0 6px 6px 0}
.tag button{width:22px;height:22px;border-radius:50%;background:var(--card);font-size:12px}
.addrow{display:flex;gap:8px;margin-top:4px}
.addrow .field{flex:1;margin:0}
.addrow button{padding:0 16px;border-radius:14px;background:var(--btn);color:var(--btnInk);font-weight:600}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-140%);background:var(--btn);color:var(--btnInk);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;transition:transform .25s;z-index:20;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.help{font-size:13.5px;color:var(--muted);line-height:1.55}
.help b{color:var(--ink);font-weight:600}
/* lock */
body.locked .fab{display:none}
body.locked{overflow:hidden}
.lock{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px)}
.lock[hidden]{display:none}
.lockin{width:100%;max-width:330px;text-align:center}
.lk-ic{font-size:34px;margin-bottom:8px}
.lk-title{font-size:19px;font-weight:600}
.lk-sub{font-size:13.5px;color:var(--muted);min-height:20px;margin:6px 0 20px;line-height:1.45}
.lk-sub.err{color:var(--exp)}
.dots{display:flex;gap:18px;justify-content:center;margin-bottom:30px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:16px 26px;justify-content:center}
.keypad button{width:72px;height:72px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:27px;font-weight:500}
.keypad button:active{background:var(--line)}
.keypad button.ghost{background:none;box-shadow:none;font-size:15px;color:var(--muted)}
.keypad button:disabled{opacity:.35}
.lk-link{margin-top:24px;color:var(--muted);font-size:14px;text-decoration:underline}
.rcode{font-size:26px;font-weight:700;letter-spacing:.12em;background:var(--card);border-radius:14px;padding:16px;margin:4px 0 14px;user-select:all;-webkit-user-select:all}
#lock .field{text-align:left}
#lock .field input{text-transform:uppercase;letter-spacing:.08em}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow button{flex:1;height:48px;border-radius:14px;font-weight:600;background:var(--soft)}
.btnrow button.pri{background:var(--btn);color:var(--btnInk)}
/* v2 */
.topbtns{display:flex;gap:8px}
.typeseg button.on.t{background:#3d85c6;color:#fff}
.chips.sel button.on{background:var(--btn);color:var(--btnInk)}
.toggle{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--ink);flex:none}
.toggle small{color:var(--muted);font-size:12.5px}
.recinfo{background:var(--soft);border-radius:14px;padding:12px;margin-bottom:10px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.recinfo button{padding:7px 12px;border-radius:10px;background:var(--card);font-weight:600;font-size:13px;flex:none}
.wallets{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 12px;padding:2px 14px;scrollbar-width:none}
.wallets::-webkit-scrollbar{display:none}
.wallet{flex:none;min-width:132px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);text-align:left}
.wallet .v{font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.tabs button{font-size:13.5px}
.bud{padding:9px 0;border-top:1px solid var(--line)}
.bud:first-of-type{border-top:0}
.bud .r{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.trend{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:8px}
.trend .m{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.trend .bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.trend .bars i{display:block;width:40%;max-width:16px;border-radius:3px 3px 1px 1px;min-height:2px}
.trend .m.cur .lb{color:var(--ink);font-weight:600}
.trend .lb{font-size:11.5px;color:var(--muted);margin-top:6px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}
table.mt{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.mt th{font-weight:500;color:var(--muted);text-align:right;padding:6px 0;font-size:12.5px}
table.mt th:first-child,table.mt td:first-child{text-align:left}
table.mt td{text-align:right;padding:7px 0;border-top:1px solid var(--line)}
.chg{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.chg:first-of-type{border-top:0}
.goal{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.goal .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.goal .t b{font-size:16px}
.goal .t button{color:var(--muted);font-size:13px;padding:4px}
.goal .nums{display:flex;justify-content:space-between;font-size:13.5px;margin-top:2px}
.goal .bar{height:10px}
.rowitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rowitem:first-of-type{border-top:0}
.rowitem .nm{flex:1;min-width:0;font-size:14px}
.rowitem .nm small{display:block;color:var(--muted);font-size:12.5px}
.rowitem button{padding:6px 10px;border-radius:10px;background:var(--soft);font-size:13px;font-weight:500;flex:none}
.sheet.tall{min-height:70vh}
.sres-sum{display:flex;gap:10px;margin-bottom:12px}
.sres-sum .pill{flex:1}
select.sel{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);padding:10px 0;-webkit-appearance:none;appearance:none}
.emojis{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.emojis button{width:42px;height:42px;border-radius:12px;background:var(--soft);font-size:21px;border:2px solid transparent}
.emojis button.on{border-color:var(--ink);background:var(--card)}
</style>
</head>
<body>
<div class="wrap" id="main"></div>
<button class="fab" data-act="add"><span>+</span> Ghi khoản mới</button>

<div class="ov" id="ov" data-act="close"></div>

<!-- Add / edit sheet -->
<div class="sheet" id="txSheet" role="dialog" aria-label="Ghi khoản">
  <div class="grab"></div>
  <div class="shead"><b id="txTitle">Ghi khoản mới</b><button data-act="close">Đóng</button></div>
  <div class="typeseg" id="typeSeg">
    <button class="e" data-act="type" data-v="expense">Khoản chi</button>
    <button class="i" data-act="type" data-v="income">Khoản thu</button>
    <button class="t" data-act="type" data-v="transfer">Chuyển ví</button>
  </div>
  <div class="amtbox"><input id="fAmt" inputmode="numeric" placeholder="0" autocomplete="off"><span>₫</span></div>
  <div class="chips">
    <button data-act="plus" data-v="000">,000</button>
    <button data-act="plus" data-v="10000">+10k</button>
    <button data-act="plus" data-v="50000">+50k</button>
    <button data-act="plus" data-v="100000">+100k</button>
    <button data-act="plus" data-v="500000">+500k</button>
    <button data-act="plus" data-v="clear">Xoá</button>
  </div>
  <div id="catWrap">
    <div class="sublbl">Danh mục</div>
    <div class="grid" id="catGrid"></div>
    <div class="sublbl">Ví</div>
    <div class="chips sel" id="walletChips"></div>
  </div>
  <div id="xferWrap" hidden>
    <div class="sublbl">Từ ví</div>
    <div class="chips sel" id="fromChips"></div>
    <div class="sublbl">Sang ví</div>
    <div class="chips sel" id="toChips"></div>
  </div>
  <div class="field"><label>Ngày</label><input type="date" id="fDate"></div>
  <div class="chips" style="margin-top:-2px">
    <button data-act="day" data-v="0">Hôm nay</button>
    <button data-act="day" data-v="-1">Hôm qua</button>
    <button data-act="day" data-v="-2">Hôm kia</button>
  </div>
  <div class="field"><label>Ghi chú</label><input id="fNote" placeholder="VD: cà phê với bạn" maxlength="120" autocomplete="off"></div>
  <label class="toggle" id="recWrap"><input type="checkbox" id="fRec"><span><b>Lặp lại hằng tháng</b><br><small>Tự ghi khoản này vào cùng ngày mỗi tháng</small></span></label>
  <div class="recinfo" id="recInfo" hidden></div>
  <div class="err" id="fErr"></div>
  <button class="primary" data-act="save">Lưu</button>
  <button class="danger" id="delBtn" data-act="del">Xoá khoản này</button>
</div>

<!-- Settings sheet -->
<div class="sheet" id="setSheet" role="dialog" aria-label="Cài đặt">
  <div class="grab"></div>
  <div class="shead"><b>Cài đặt</b><button data-act="close">Xong</button></div>
  <div id="setBody"></div>
</div>

<!-- Search sheet -->
<div class="sheet tall" id="searchSheet" role="dialog" aria-label="Tìm kiếm">
  <div class="grab"></div>
  <div class="shead"><b>Tìm kiếm</b><button data-act="close">Đóng</button></div>
  <div class="field"><label>🔍</label><input id="fSearch" placeholder="Ghi chú hoặc danh mục, VD: cà phê" autocomplete="off" enterkeyhint="search"></div>
  <div class="seg" id="searchRange" style="margin-bottom:12px">
    <button data-act="srange" data-v="all" class="on">Tất cả</button><button data-act="srange" data-v="year">Năm nay</button><button data-act="srange" data-v="month">Tháng đang xem</button>
  </div>
  <div id="searchRes"></div>
</div>

<!-- Generic form sheet -->
<div class="sheet" id="formSheet" role="dialog">
  <div class="grab"></div>
  <div class="shead"><b id="formTitle"></b><button data-act="close">Đóng</button></div>
  <div id="formBody"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Lock screen -->
<div class="lock" id="lock" hidden>
  <div class="lockin">
    <div class="lk-ic">🔒</div>
    <div class="lk-title" id="lkTitle">Nhập mã PIN</div>
    <div class="lk-sub" id="lkSub"></div>
    <div id="lkPad">
      <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
      <div class="keypad">
        <button data-act="key" data-v="1">1</button><button data-act="key" data-v="2">2</button><button data-act="key" data-v="3">3</button>
        <button data-act="key" data-v="4">4</button><button data-act="key" data-v="5">5</button><button data-act="key" data-v="6">6</button>
        <button data-act="key" data-v="7">7</button><button data-act="key" data-v="8">8</button><button data-act="key" data-v="9">9</button>
        <button class="ghost" id="lkCancel" data-act="lkcancel">Huỷ</button><button data-act="key" data-v="0">0</button><button class="ghost" data-act="bk" aria-label="Xoá">⌫</button>
      </div>
      <button class="lk-link" id="lkForgot" data-act="forgot">Quên mã PIN?</button>
    </div>
    <div id="lkRecover" hidden>
      <div class="field"><input id="fRecover" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off" autocapitalize="characters"></div>
      <div class="btnrow"><button data-act="recoverback">Quay lại</button><button class="pri" data-act="recover">Mở khoá</button></div>
    </div>
    <div id="lkCode" hidden>
      <div class="rcode" id="rcode"></div>
      <div class="btnrow"><button data-act="copycode">Sao chép</button><button class="pri" data-act="codeok">Tôi đã lưu</button></div>
    </div>
  </div>
</div>

<script>
const STANDALONE = !!document.querySelector('meta[name="standalone-build"]');
if(STANDALONE && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
// ---------- Danh mục ----------
const BASE = {
  expense: [
    {id:'an',name:'Ăn uống',ic:'🍜'},{id:'cho',name:'Đi chợ',ic:'🛒'},{id:'dilai',name:'Đi lại, xăng',ic:'🛵'},
    {id:'nha',name:'Nhà cửa',ic:'🏠'},{id:'hoadon',name:'Điện nước, mạng',ic:'💡'},{id:'muasam',name:'Mua sắm',ic:'🛍️'},
    {id:'giaitri',name:'Giải trí',ic:'🎬'},{id:'suckhoe',name:'Sức khoẻ',ic:'💊'},{id:'hoctap',name:'Học tập',ic:'📚'},
    {id:'giadinh',name:'Gia đình',ic:'👨‍👩‍👧'},{id:'quatang',name:'Quà, hiếu hỉ',ic:'🎁'},{id:'khac',name:'Khác',ic:'📦'}
  ],
  income: [
    {id:'luong',name:'Lương',ic:'💼'},{id:'day',name:'Dạy học',ic:'🧑‍🏫'},{id:'thuong',name:'Thưởng',ic:'🎉'},
    {id:'kinhdoanh',name:'Kinh doanh',ic:'🏪'},{id:'dautu',name:'Đầu tư, lãi',ic:'📈'},{id:'thukhac',name:'Thu khác',ic:'💰'}
  ]
};
const PALETTE = ['#e07a5f','#3d85c6','#e9b44c','#7b6ccf','#3fa37c','#d45d8a','#4fb0c6','#a07c55','#8fae3c','#c76b3a','#6b7fa8','#b06cc0','#5e9c9a','#d9a5a0'];

// ---------- Tiện ích ----------
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mkey = d => d.getFullYear()+'-'+pad(d.getMonth()+1);
const fmt = n => Math.round(n).toLocaleString('vi-VN')+' ₫';
const fmtNum = n => n ? Math.round(n).toLocaleString('vi-VN') : '';
const short = n => { const a=Math.abs(n);
  if(a>=1e9) return (n/1e9).toFixed(1).replace(/\.0$/,'').replace('.',',')+' tỷ';
  if(a>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'').replace('.',',')+'tr';
  if(a>=1e3) return Math.round(n/1e3)+'k'; return String(Math.round(n)); };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const uid8 = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const WD = ['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const daysIn = k => { const [y,m]=k.split('-').map(Number); return new Date(y,m,0).getDate(); };

// ---------- Trạng thái ----------
const S = {
  months:{}, settings:null,
  cur: mkey(new Date()), tab:'overview', brk:'expense', filter:null, selDay:null,
  mode:'loading', loading:true, staleNote:false
};
const DEFAULT_WALLETS = [{id:'cash',name:'Tiền mặt',ic:'💵',init:0},{id:'bank',name:'Ngân hàng',ic:'🏦',init:0},{id:'ewallet',name:'Ví điện tử',ic:'📱',init:0}];
const arr = x => Array.isArray(x) ? x.map(o=>({...o})) : [];
function normSettings(v){
  v = v || {};
  const c = v.custom || {};
  const p = v.pin;
  const cb = {}; if(v.catBudgets && typeof v.catBudgets==='object') for(const k in v.catBudgets){ const n=Number(v.catBudgets[k]); if(n>0) cb[k]=n; }
  return { budget: Number(v.budget) || 0,
    custom: { expense: arr(c.expense), income: arr(c.income) },
    catBudgets: cb,
    wallets: Array.isArray(v.wallets) && v.wallets.length ? arr(v.wallets) : DEFAULT_WALLETS.map(w=>({...w})),
    recurring: arr(v.recurring),
    goals: arr(v.goals),
    pin: (p && p.hash && p.salt) ? { salt:p.salt, hash:p.hash, rsalt:p.rsalt||'', rhash:p.rhash||'' } : null };
}
S.settings = normSettings({});
function setSettings(patch){ S.settings = { ...S.settings, ...patch }; persist('settings'); }
// ---- Ví ----
const wallets = (all) => all ? S.settings.wallets : S.settings.wallets.filter(w=>!w.hidden);
const walletOf = id => S.settings.wallets.find(w=>w.id===id) || S.settings.wallets[0] || DEFAULT_WALLETS[0];
const txWallet = t => t.wallet || 'cash';
function walletBalances(){
  const bal = {}; for(const w of S.settings.wallets) bal[w.id] = Number(w.init)||0;
  const add = (id,v) => { if(!(id in bal)) bal[id]=0; bal[id]+=v; };
  for(const k in S.months) for(const t of monthTx(k)){
    if(t.type==='income') add(txWallet(t), t.amount);
    else if(t.type==='expense') add(txWallet(t), -t.amount);
    else if(t.type==='transfer'){ add(t.wallet||'cash', -t.amount); add(t.to||'cash', t.amount); }
  }
  return bal;
}
const allTx = () => { const out=[]; for(const k in S.months) for(const t of monthTx(k)) out.push(t); return out; };
const fold = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const mlabel = k => { const [y,m]=k.split('-').map(Number); return 'T'+m+(y!==new Date().getFullYear()?'/'+String(y).slice(2):''); };
const addMonths = (k,d) => { const [y,m]=k.split('-').map(Number); return mkey(new Date(y,m-1+d,1)); };
function cats(type, includeHidden){
  const list = BASE[type].concat(S.settings.custom[type]||[]);
  return includeHidden ? list : list.filter(c=>!c.hidden);
}
function catOf(type,id){
  return cats(type,true).find(c=>c.id===id) || {id, name:'Khác', ic:'📦'};
}
function colorOf(type,id){
  const i = cats(type,true).findIndex(c=>c.id===id);
  return PALETTE[(i<0?0:i + (type==='income'?5:0)) % PALETTE.length];
}
const monthTx = (k=S.cur) => (S.months[k] && S.months[k].tx) || [];
function totals(list){ let inc=0,exp=0; for(const t of list){ if(t.type==='income') inc+=t.amount; else if(t.type==='expense') exp+=t.amount; } return {inc,exp}; }

// ---------- Lưu trữ ----------
let db=null, colRef=null;
const dirty=new Set(), queues={};
const LS_KEY='sothuchi.v1';

function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({months:S.months, settings:S.settings})); }
  catch(e){ S.mode='memory'; }
}
function loadLocal(){
  try{ const raw=localStorage.getItem(LS_KEY); S.mode='local';
    if(raw){ const o=JSON.parse(raw); S.months=o.months||{}; S.settings=normSettings(o.settings||{}); } }
  catch(e){ S.mode='memory'; }
  S.loading=false;
}
function bodyFor(docId){
  return docId==='settings' ? clone(S.settings) : { tx: clone(monthTx(docId.slice(2))) };
}
function persist(docId){
  if(S.mode!=='db'){ saveLocal(); return; }
  dirty.add(docId);
  const run = async () => {
    const body = bodyFor(docId);
    try { await colRef.doc(docId).set(body); }
    catch(e){
      if(e && e.code==='unavailable'){ await sleep(700+Math.random()*900);
        try{ await colRef.doc(docId).set(bodyFor(docId)); } catch(e2){ toast('Chưa lưu được — kiểm tra kết nối mạng'); } }
      else if(e && e.code==='quota_exceeded') toast('Bộ nhớ đã đầy, không lưu thêm được');
      else toast('Không lưu được dữ liệu');
    }
  };
  const p = (queues[docId]||Promise.resolve()).then(run);
  queues[docId]=p;
  p.finally(()=>{ if(queues[docId]===p){ delete queues[docId]; dirty.delete(docId); } });
}

async function init(){
  render();
  let user=null, id=null;
  const cl = window.claude;
  if(cl && typeof cl.use==='function'){
    try{
      const [d,u] = await Promise.all([cl.use('db'), cl.use('user')]);
      user=u; if(d && u){ id = await u.id(); if(id) db=d; }
    }catch(e){ db=null; }
  }
  if(db && id){ S.mode='db'; subscribe(id); }
  else { loadLocal(); S.synced=true; applyRecurring(); render(); }
}
function subscribe(id){
  colRef = db.collection('data/users/'+id);
  const timer = setTimeout(()=>{ S.loading=false; S.staleNote=true; render(); }, 10000);
  colRef.onSnapshot(snap=>{
    for(const d of snap.docs){
      if(dirty.has(d.id)) continue;
      const v = d.data() || {};
      if(d.id==='settings') S.settings = normSettings(v);
      else if(d.id.startsWith('m-')) S.months[d.id.slice(2)] = { tx: Array.isArray(v.tx) ? v.tx.slice() : [] };
    }
    if(!snap.metadata.fromCache){ clearTimeout(timer); S.staleNote=false; if(!S.synced){ S.synced=true; applyRecurring(); } }
    S.loading=false; render();
  }, err=>{
    clearTimeout(timer); S.loading=false; S.staleNote=false;
    toast('Mất kết nối dữ liệu — mở lại app để đồng bộ'); render();
  });
}

// ---------- Giao diện chính ----------
function render(){
  const el = document.getElementById('main');
  if(!S.loading && pinOn() && !S.unlocked){
    el.innerHTML=''; if(L.mode!=='unlock') showLock('unlock'); return;
  }
  const [y,m] = S.cur.split('-').map(Number);
  const isNow = S.cur===mkey(new Date());
  let h = `<div class="top"><div class="brand">Sổ Thu Chi</div><div class="topbtns"><button class="iconbtn" data-act="search" aria-label="Tìm kiếm">🔍</button><button class="iconbtn" data-act="settings" aria-label="Cài đặt">⚙︎</button></div></div>
  <div class="month"><button data-act="prev" aria-label="Tháng trước">‹</button><b>Tháng ${m}/${y}${isNow?' · tháng này':''}</b><button data-act="next" aria-label="Tháng sau">›</button></div>`;

  if(S.mode==='memory' || (S.mode==='local' && !STANDALONE))
    h += `<div class="note-banner">${S.mode==='local'?'Dữ liệu đang lưu trên trình duyệt của máy này.':'Không lưu được trên máy này — dữ liệu sẽ mất khi đóng trang.'}</div>`;
  if(STANDALONE && S.mode==='local' && !S.loading){
    const n = allTx().length, lb=lastBackup();
    if(n>=10 && (!lb || Date.now()-lb > 14*864e5))
      h += `<div class="note-banner">💾 ${lb?'Đã hơn 2 tuần chưa sao lưu.':'Bạn chưa sao lưu lần nào.'} Vào ⚙︎ Cài đặt → <b>Sao lưu ra file</b> để giữ dữ liệu an toàn.</div>`;
  }
  if(S.staleNote) h += `<div class="note-banner">Chưa kết nối được dữ liệu, số liệu có thể chưa mới nhất.</div>`;

  if(S.loading){ el.innerHTML = h + '<div class="skel"></div><div class="skel" style="height:220px"></div>'; return; }

  const list = monthTx(); const {inc,exp} = totals(list); const bal = inc-exp;
  h += `<div class="card"><div class="lbl">Còn lại trong tháng</div>
    <div class="big ${bal<0?'exp':''}">${bal<0?'−':''}${fmt(Math.abs(bal))}</div>
    <div class="row2"><div class="pill"><div class="lbl">Tổng thu</div><div class="v inc">+${fmt(inc)}</div></div>
    <div class="pill"><div class="lbl">Tổng chi</div><div class="v exp">−${fmt(exp)}</div></div></div>`;
  const B = S.settings.budget;
  if(B>0){
    const r = exp/B, col = r>=1?'var(--exp)':r>=.8?'var(--warn)':'var(--inc)';
    let extra='';
    if(isNow && B-exp>0){ const left = daysIn(S.cur)-new Date().getDate()+1; extra = ` · tối đa ${fmt((B-exp)/left)}/ngày cho ${left} ngày còn lại`; }
    h += `<div class="budget"><div class="small">Ngân sách chi: ${fmt(exp)} / ${fmt(B)}</div>
      <div class="bar"><i style="width:${Math.min(100,r*100).toFixed(1)}%;background:${col}"></i></div>
      <div class="small">${B-exp>=0?'Còn '+fmt(B-exp):'<span class="exp">Vượt '+fmt(exp-B)+'</span>'}${extra}</div></div>`;
  }
  h += `</div>`;

  // Ví
  const wb = walletBalances(), vis = wallets();
  const sum = vis.reduce((s,w)=>s+(wb[w.id]||0),0);
  h += `<div class="wallets"><div class="wallet" style="background:var(--soft);box-shadow:none"><div class="lbl">Tổng các ví</div><div class="v ${sum<0?'exp':''}">${sum<0?'−':''}${fmt(Math.abs(sum))}</div></div>`
    + vis.map(w=>`<button class="wallet" data-act="pickwallet" data-v="${esc(w.id)}"><div class="lbl">${w.ic} ${esc(w.name)}</div><div class="v ${(wb[w.id]||0)<0?'exp':''}">${(wb[w.id]||0)<0?'−':''}${fmt(Math.abs(wb[w.id]||0))}</div></button>`).join('')
    + `<button class="wallet" data-act="walletform" style="min-width:auto;color:var(--muted);font-weight:600">+ Ví</button></div>`;

  const T = [['overview','Phân loại'],['journal','Nhật ký'],['trend','Xu hướng'],['goals','Mục tiêu']];
  h += `<div class="tabs">${T.map(([k,n])=>`<button data-act="tab" data-v="${k}" class="${S.tab===k?'on':''}">${n}</button>`).join('')}</div>`;
  h += S.tab==='overview' ? renderOverview(list) : S.tab==='journal' ? renderJournal(list) : S.tab==='trend' ? renderTrend() : renderGoals();
  el.innerHTML = h;
}

function byCat(list, type){ const by={}; for(const t of list) if(t.type===type) by[t.cat]=(by[t.cat]||0)+t.amount; return by; }

function renderOverview(list){
  const type = S.brk;
  const items = list.filter(t=>t.type===type);
  const total = items.reduce((s,t)=>s+t.amount,0);
  const by = byCat(list, type);
  const rows = Object.entries(by).sort((a,b)=>b[1]-a[1]);

  let h = `<div class="card"><div class="h">${type==='expense'?'Chi tiêu':'Thu nhập'} theo danh mục
    <span class="seg"><button data-act="brk" data-v="expense" class="${type==='expense'?'on':''}">Chi</button><button data-act="brk" data-v="income" class="${type==='income'?'on':''}">Thu</button></span></div>`;
  if(!rows.length){
    h += `<div class="empty"><div class="e">${type==='expense'?'🧾':'💰'}</div>Chưa có khoản ${type==='expense'?'chi':'thu'} nào trong tháng này.</div></div>`;
  } else {
    const R=78, C=2*Math.PI*R; let off=0, arcs='';
    for(const [id,v] of rows){
      const len = v/total*C, gap = rows.length>1 && len>4 ? 2 : 0;
      arcs += `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${colorOf(type,id)}" stroke-width="24" stroke-dasharray="${Math.max(len-gap,0.01)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;
      off += len;
    }
    h += `<div class="donutwrap"><svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Biểu đồ tỉ lệ theo danh mục">${arcs}
      <text x="100" y="94" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="inherit">Tổng ${type==='expense'?'chi':'thu'}</text>
      <text x="100" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink)" font-family="inherit">${short(total)}</text></svg></div><div>`;
    for(const [id,v] of rows){
      const c = catOf(type,id), col = colorOf(type,id), p = v/total*100;
      h += `<button class="cat" data-act="pickcat" data-v="${esc(id)}" data-t="${type}"><span class="dot" style="background:${col}"></span>
        <div class="nm"><div>${c.ic} ${esc(c.name)}</div><div class="mini"><i style="width:${p.toFixed(1)}%;background:${col}"></i></div></div>
        <div class="amt">${fmt(v)}<div class="pct">${p<1?'<1':Math.round(p)}%</div></div></button>`;
    }
    h += `</div><div class="small" style="margin-top:8px">Chạm vào danh mục để xem chi tiết từng khoản.</div></div>`;
  }

  if(type==='expense'){
    // Ngân sách theo danh mục
    const cb = S.settings.catBudgets, keys = Object.keys(cb);
    h += `<div class="card"><div class="h">Ngân sách theo danh mục<span class="seg"><button class="on" data-act="cbform">+ Đặt</button></span></div>`;
    if(!keys.length) h += `<div class="small">Đặt mức chi tối đa cho từng danh mục (VD: Ăn uống 3 triệu/tháng). App sẽ cảnh báo khi sắp vượt.</div>`;
    else {
      keys.sort((a,b)=>(by[b]||0)/cb[b]-(by[a]||0)/cb[a]);
      for(const k of keys){
        const c=catOf('expense',k), sp=by[k]||0, r=sp/cb[k], col=r>=1?'var(--exp)':r>=.8?'var(--warn)':'var(--inc)';
        h += `<button class="bud" style="display:block;width:100%;text-align:left" data-act="cbform" data-v="${esc(k)}"><div class="r"><span>${c.ic} ${esc(c.name)}</span><span><b>${short(sp)}</b> / ${short(cb[k])}</span></div>
          <div class="bar"><i style="width:${Math.min(100,r*100).toFixed(1)}%;background:${col}"></i></div>
          <div class="small">${cb[k]-sp>=0?'Còn '+fmt(cb[k]-sp):'<span class="exp">Vượt '+fmt(sp-cb[k])+'</span>'}</div></button>`;
      }
    }
    h += `</div>`;

    // Chi theo ngày
    const n = daysIn(S.cur), perDay = new Array(n+1).fill(0);
    for(const t of items){ const d = Number(t.date.slice(8,10)); if(d>=1&&d<=n) perDay[d]+=t.amount; }
    const max = Math.max(1,...perDay);
    const isNow = S.cur===mkey(new Date()); const today = new Date().getDate();
    const elapsed = isNow ? today : (S.cur < mkey(new Date()) ? n : 0);
    let bars='';
    for(let d=1; d<=n; d++){
      const v=perDay[d], cls=[v?'':'zero', isNow&&d===today?'today':'', S.selDay===d?'sel':''].join(' ');
      bars += `<button class="${cls}" data-act="selday" data-v="${d}" aria-label="Ngày ${d}: ${fmt(v)}"><i style="height:${v? Math.max(3,v/max*100):2}%"></i></button>`;
    }
    const [, mm] = S.cur.split('-');
    let cap = elapsed ? `Trung bình <b>${fmt(total/elapsed)}</b> mỗi ngày` : 'Tháng này chưa tới';
    if(S.selDay) cap = `Ngày ${pad(S.selDay)}/${mm}: <b>${fmt(perDay[S.selDay])}</b>`;
    h += `<div class="card"><div class="h">Chi tiêu từng ngày</div><div class="days">${bars}</div>
      <div class="daylbl"><span>1</span><span>${Math.round(n/2)}</span><span>${n}</span></div><div class="caption">${cap}</div></div>`;
  }
  return h;
}

function txRow(t, withDate){
  let ic, name, cls='', sign='';
  if(t.type==='transfer'){ ic='🔁'; name=`${walletOf(t.wallet).name} → ${walletOf(t.to).name}`; }
  else { const c=catOf(t.type,t.cat); ic=c.ic; name=c.name; cls=t.type==='income'?'inc':'exp'; sign=t.type==='income'?'+':'−'; }
  const sub=[];
  if(withDate){ const d=parseD(t.date); sub.push(pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()); }

function renderJournal(list){

  }

  for(const ds of dates){
    const arr = by[ds].sort((a,b)=>(b.ts||0)-(a.ts||0));
    const d = parseD(ds); const {inc,exp} = totals(arr);

    h += `</div>`;
  }
  return h;
}

// ---------- Xu hướng ----------
function renderTrend(){
  const ks=[]; for(let i=5;i>=0;i--) ks.push(addMonths(S.cur,-i));
  const data = ks.map(k=>({k, ...totals(monthTx(k))}));
  const max = Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  let h = `<div class="card"><div class="h">Thu – chi 6 tháng</div><div class="trend">`
    + data.map(d=>`<div class="m ${d.k===S.cur?'cur':''}"><div class="bars"><i style="height:${d.inc? Math.max(2,d.inc/max*100):0}%;background:var(--inc)" title="Thu ${fmt(d.inc)}"></i><i style="height:${d.exp? Math.max(2,d.exp/max*100):0}%;background:var(--exp)" title="Chi ${fmt(d.exp)}"></i></div><div class="lb">${mlabel(d.k)}</div></div>`).join('')
    + `</div><div class="legend"><span style="--c:var(--inc)">Thu</span><span style="--c:var(--exp)">Chi</span></div>
    <table class="mt" style="margin-top:12px"><tr><th>Tháng</th><th>Thu</th><th>Chi</th><th>Để dành</th></tr>`
    + data.slice().reverse().map(d=>{ const s=d.inc-d.exp; const rate = d.inc>0 ? Math.round(s/d.inc*100)+'%' : ''; 
        return `<tr><td>${mlabel(d.k)}</td><td>${short(d.inc)}</td><td>${short(d.exp)}</td><td class="${s<0?'exp':s>0?'inc':''}">${s<0?'−':''}${short(Math.abs(s))}${rate?` <span class="pct">${rate}</span>`:''}</td></tr>`; }).join('')
    + `</table>`;
  const withData = data.filter(d=>d.exp>0 && d.k!==mkey(new Date()));
  if(withData.length) h += `<div class="small" style="margin-top:10px">Chi trung bình ${withData.length} tháng đã qua: <b>${fmt(withData.reduce((s,d)=>s+d.exp,0)/withData.length)}</b>/tháng</div>`;
  h += `</div>`;

  // So sánh với tháng trước
  const prevK = addMonths(S.cur,-1), isNow = S.cur===mkey(new Date()), today = new Date().getDate();
  let prevList = monthTx(prevK);
  if(isNow) prevList = prevList.filter(t=>Number(t.date.slice(8,10))<=today);
  const cur = byCat(monthTx(), 'expense'), prev = byCat(prevList, 'expense');
  const curT = Object.values(cur).reduce((a,b)=>a+b,0), prevT = Object.values(prev).reduce((a,b)=>a+b,0);
  const period = isNow ? `cùng kỳ ${mlabel(prevK)} (1–${Math.min(today,daysIn(prevK))})` : mlabel(prevK);
  h += `<div class="card"><div class="h">So với ${period}</div>`;
  if(!curT && !prevT) h += `<div class="small">Chưa đủ dữ liệu để so sánh.</div>`;
  else {
    const d = curT-prevT;
    h += `<div style="margin-bottom:10px">Tổng chi ${d>0?'<b class="exp">tăng '+fmt(d)+'</b>':d<0?'<b class="inc">giảm '+fmt(-d)+'</b>':'<b>không đổi</b>'}${prevT>0&&d?` (${d>0?'+':'−'}${Math.round(Math.abs(d)/prevT*100)}%)`:''}</div>`;
    const ids = [...new Set(Object.keys(cur).concat(Object.keys(prev)))]
      .map(id=>({id, a:cur[id]||0, b:prev[id]||0})).filter(x=>x.a!==x.b).sort((x,y)=>Math.abs(y.a-y.b)-Math.abs(x.a-x.b)).slice(0,6);
    for(const x of ids){
      const c=catOf('expense',x.id), dd=x.a-x.b;
      h += `<div class="chg"><span>${c.ic} ${esc(c.name)}</span><span class="${dd>0?'exp':'inc'}">${dd>0?'+':'−'}${short(Math.abs(dd))} <span class="pct">${x.b>0?(dd>0?'+':'−')+Math.round(Math.abs(dd)/x.b*100)+'%':'mới'}</span></span></div>`;
    }
  }
  h += `</div>`;
  return h;
}

// ---------- Mục tiêu ----------
function renderGoals(){
  const gs = S.settings.goals;
  let h = '';
  if(!gs.length) h += `<div class="card empty"><div class="e">🎯</div>Đặt mục tiêu tiết kiệm (du lịch, mua xe, quỹ dự phòng…) và theo dõi tiến độ mỗi lần bạn để dành.</div>`;
  const nowK = mkey(new Date());
  for(const g of gs){
    const r = g.target>0 ? g.saved/g.target : 0, left = Math.max(0, g.target-g.saved), done = g.saved>=g.target && g.target>0;
    let plan = '';
    if(!done && g.deadline){
      const [y1,m1]=nowK.split('-').map(Number), [y2,m2]=g.deadline.split('-').map(Number);
      const months = (y2-y1)*12+(m2-m1)+1;
      plan = months>0 ? `Hạn ${m2}/${y2} · cần góp <b>${fmt(Math.ceil(left/months/1000)*1000)}</b>/tháng trong ${months} tháng` : `<span class="exp">Đã quá hạn ${m2}/${y2}</span>`;
    }
    h += `<div class="goal"><div class="t"><b>${g.ic||'🎯'} ${esc(g.name)}</b><button data-act="goalform" data-v="${esc(g.id)}">Sửa</button></div>
      <div class="nums"><span><b>${fmt(g.saved)}</b></span><span class="small">/ ${fmt(g.target)}</span></div>
      <div class="bar"><i style="width:${Math.min(100,r*100).toFixed(1)}%;background:${done?'var(--inc)':'#3d85c6'}"></i></div>
      <div class="small">${done?'🎉 Đã đạt mục tiêu!':Math.floor(r*100)+'% · còn '+fmt(left)}${plan?'<br>'+plan:''}</div>
      <div class="btnrow"><button class="pri" data-act="goalmove" data-v="${esc(g.id)}" data-t="in">+ Góp thêm</button><button data-act="goalmove" data-v="${esc(g.id)}" data-t="out">Rút ra</button></div></div>`;
  }
  h += `<div class="btnrow" style="margin-top:0"><button data-act="goalform" style="background:var(--card);box-shadow:var(--shadow)">+ Thêm mục tiêu</button></div>`;
  return h;
}

// ---------- Khoản định kỳ ----------
function applyRecurring(){
  if(!S.synced) return 0;
  const nowK = mkey(new Date()), today = new Date().getDate();
  const ids = new Set(allTx().map(t=>t.id)), changed = new Set();
  for(const r of S.settings.recurring){
    if(r.paused || !r.start) continue;
    let k = r.start, guard = 0;
    while(k <= nowK && guard++ < 240){
      const day = Math.min(r.day, daysIn(k));
      if(k===nowK && day>today) break;
      const id = 'r_'+r.id+'_'+k;
      if(!(r.skip||[]).includes(k) && !ids.has(id)){
        const tx = { id, type:r.type, amount:r.amount, cat:r.cat, wallet:r.wallet||'cash', date:k+'-'+pad(day), note:r.note||'', rec:r.id, ts:Date.now() };
        S.months[k] = { tx: monthTx(k).concat([tx]) }; changed.add(k); ids.add(id);
      }
      k = addMonths(k,1);
    }
  }
  for(const k of changed) persist('m-'+k);
  if(changed.size) render();
  return changed.size;
}
const ruleOf = id => S.settings.recurring.find(r=>r.id===id);
function updRule(id, patch){ setSettings({ recurring: S.settings.recurring.map(r=>r.id===id?{...r,...patch}:r) }); }

function findTx(id){ for(const mk in S.months){ const t = monthTx(mk).find(x=>x.id===id); if(t) return {t, k:mk}; } return null; }
function saveTx(){
  const amount = amtVal(), date = $('fDate').value, note = $('fNote').value.trim();
  if(!amount){ $('fErr').textContent='Nhập số tiền nhé.'; return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ $('fErr').textContent='Chọn ngày.'; return; }
  const xfer = F.type==='transfer';
  if(xfer){
    if(!F.from || !F.to){ $('fErr').textContent='Chọn ví chuyển đi và ví nhận.'; return; }
    if(F.from===F.to){ $('fErr').textContent='Ví chuyển đi và ví nhận phải khác nhau.'; return; }
  } else if(!F.cat){ $('fErr').textContent='Chọn một danh mục.'; return; }
  const k = date.slice(0,7);
  const found = F.id ? findTx(F.id) : null, old = found && found.t, oldK = found && found.k;
  let tx = xfer
    ? { id: F.id || uid8(), type:'transfer', amount, wallet:F.from, to:F.to, date, note, ts: old ? old.ts : Date.now() }
    : { id: F.id || uid8(), type:F.type, amount, cat:F.cat, wallet:F.wallet, date, note, ts: old ? old.ts : Date.now() };
  if(old && old.rec && !xfer) tx.rec = old.rec;
  if(!F.id && !xfer && $('fRec').checked){
    const rid = uid8();
    setSettings({ recurring: S.settings.recurring.concat([{ id:rid, type:F.type, amount, cat:F.cat, wallet:F.wallet, day:Number(date.slice(8,10)), note, start:k, skip:[] }]) });
    tx.id = 'r_'+rid+'_'+k; tx.rec = rid;
  }
  if(oldK && oldK!==k){ S.months[oldK] = { tx: monthTx(oldK).filter(x=>x.id!==F.id) }; persist('m-'+oldK); }
  const cur = monthTx(k).filter(x=>x.id!==tx.id); cur.push(tx);
  S.months[k] = { tx: cur }; persist('m-'+k);
  if(!xfer){ try{ localStorage.setItem('sothuchi.lastWallet', F.wallet); }catch(e){} }
  if(k!==S.cur){ S.cur=k; S.selDay=null; }
  closeSheets(); render();
  let msg = F.id ? 'Đã cập nhật' : xfer ? 'Đã chuyển '+fmt(amount) : (F.type==='expense'?'Đã ghi khoản chi ':'Đã ghi khoản thu ')+fmt(amount);
  if(tx.type==='expense'){
    const lim = S.settings.catBudgets[tx.cat];
    if(lim){ const sp = byCat(monthTx(k),'expense')[tx.cat]||0, c=catOf('expense',tx.cat);
      if(sp>lim) msg = `⚠️ ${c.name} đã vượt ngân sách ${fmt(sp-lim)}`;
      else if(sp>=lim*.8) msg = `⚠️ ${c.name} đã dùng ${Math.round(sp/lim*100)}% ngân sách`; }
  }
  if(!F.id && tx.rec) msg += ' · sẽ tự ghi mỗi tháng';
  toast(msg);
}
function delTx(){
  if(!F.delArm){ F.delArm=true; $('delBtn').classList.add('confirm'); $('delBtn').textContent='Chạm lần nữa để xoá'; return; }
  const f = findTx(F.id);
  if(f){
    S.months[f.k] = { tx: monthTx(f.k).filter(x=>x.id!==F.id) }; persist('m-'+f.k);
    if(f.t.rec){ const r = ruleOf(f.t.rec); const m = F.id.split('_').pop(); if(r) updRule(r.id, { skip: (r.skip||[]).concat([/^\d{4}-\d{2}$/.test(m)?m:f.k]) }); }
  }
  closeSheets(); render(); toast('Đã xoá');
}

// ---------- Khoá mã PIN ----------
const PIN_LEN = 4, RELOCK_MS = 30000;
const L = { mode:null, buf:'', first:'', after:null, fails:0, until:0, timer:null };
S.unlocked = false;
const pinOn = () => !!(S.settings.pin && S.settings.pin.hash);
function rand(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(x=>x.toString(16).padStart(2,'0')).join(''); }
async function sha(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
async function hashPin(pin, salt){ let h = salt+':'+pin; for(let i=0;i<2000;i++) h = await sha(h+salt); return h; }
function newRecovery(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const a=new Uint8Array(8); crypto.getRandomValues(a); const s=[...a].map(x=>A[x%A.length]).join(''); return s.slice(0,4)+'-'+s.slice(4); }
const normCode = s => String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
try{ const o=JSON.parse(localStorage.getItem('sothuchi.lockout')||'{}'); L.fails=o.f||0; L.until=o.u||0; }catch(e){}
function saveLockout(){ try{ localStorage.setItem('sothuchi.lockout', JSON.stringify({f:L.fails,u:L.until})); }catch(e){} }

const TITLES = {
  unlock:['Nhập mã PIN','Sổ Thu Chi đang được khoá'],
  set1:['Đặt mã PIN mới','Chọn 4 số dễ nhớ với bạn'],
  set2:['Nhập lại mã PIN','Để chắc chắn bạn nhớ đúng'],
  verify:['Nhập mã PIN hiện tại','Xác nhận trước khi thay đổi']
};
function view(which){ $('lkPad').hidden = which!=='pad'; $('lkRecover').hidden = which!=='recover'; $('lkCode').hidden = which!=='code'; }
function showLock(mode, after){
  L.mode=mode; L.buf=''; if(after!==undefined) L.after=after;
  closeSheets(); document.body.classList.add('locked'); $('lock').hidden=false; view('pad');
  $('lkTitle').textContent = TITLES[mode][0]; setSub(TITLES[mode][1]);
  $('lkCancel').style.visibility = mode==='unlock' ? 'hidden' : 'visible';
  $('lkForgot').style.display = (mode==='unlock' || mode==='verify') && S.settings.pin && S.settings.pin.rhash ? '' : 'none';
  paintDots(); tickLockout();
}
function hideLock(){ L.mode=null; L.buf=''; L.after=null; $('lock').hidden=true; document.body.classList.remove('locked'); clearInterval(L.timer); }
function setSub(t, err){ const s=$('lkSub'); s.textContent=t; s.classList.toggle('err', !!err); }
function paintDots(){ [...$('dots').children].forEach((d,i)=>d.classList.toggle('on', i<L.buf.length)); }
function shake(msg){ const d=$('dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); L.buf=''; paintDots(); setSub(msg,true); }
function lockedOut(){ return Date.now() < L.until; }
function tickLockout(){
  clearInterval(L.timer);
  const keys = document.querySelectorAll('.keypad button[data-act="key"]');
  const upd = () => {
    const out = lockedOut() && (L.mode==='unlock' || L.mode==='verify'); keys.forEach(k=>k.disabled=out);
    if(out) setSub('Sai quá nhiều lần. Thử lại sau '+Math.ceil((L.until-Date.now())/1000)+' giây', true);
    else { clearInterval(L.timer); if($('lkSub').textContent.startsWith('Sai quá')) setSub(TITLES[L.mode||'unlock'][1]); }
  };
  upd(); if(lockedOut()) L.timer=setInterval(upd, 1000);
}
function registerFail(){
  L.fails++; if(L.fails>=5){ L.until = Date.now() + 30000*Math.pow(2, Math.min(L.fails-5, 6)); } saveLockout();
}
function resetFails(){ L.fails=0; L.until=0; saveLockout(); }
async function checkPin(pin){ const p=S.settings.pin; return !!p && (await hashPin(pin, p.salt)) === p.hash; }

async function onFullPin(){
  const pin = L.buf;
  if(L.mode==='unlock' || L.mode==='verify'){
    if(lockedOut()) return;
    if(await checkPin(pin)){
      resetFails();
      if(L.mode==='unlock'){ S.unlocked=true; hideLock(); render(); }
      else { const next=L.after; L.after=null; if(next==='off'){ disablePin(); } else showLock('set1'); }
    } else { registerFail(); shake('Sai mã PIN, thử lại'); tickLockout(); }
  } else if(L.mode==='set1'){
    L.first=pin; showLock('set2');
  } else if(L.mode==='set2'){
    if(pin!==L.first){ L.first=''; showLock('set1'); shake('Hai lần nhập không khớp, đặt lại nhé'); return; }
    setSub('Đang lưu…');
    const salt=rand(16), rsalt=rand(16), code=newRecovery();
    const p = { salt, hash: await hashPin(pin,salt), rsalt, rhash: await hashPin(normCode(code), rsalt) };
    S.settings = { ...S.settings, pin:p }; S.unlocked=true; resetFails(); persist('settings');
    $('lkTitle').textContent='Mã khôi phục của bạn';
    setSub('Lưu mã này lại (chụp màn hình hoặc ghi vào Ghi chú). Dùng nó khi quên mã PIN.');
    $('rcode').textContent=code; view('code');
  }
}
function disablePin(){
  S.settings = { ...S.settings, pin:null }; persist('settings'); hideLock(); render(); toast('Đã tắt khoá mã PIN');
}
async function tryRecover(){
  const p=S.settings.pin; const code=normCode($('fRecover').value);
  if(lockedOut()){ setSub('Đợi một chút rồi thử lại', true); return; }
  if(p && p.rhash && code.length===8 && (await hashPin(code,p.rsalt))===p.rhash){
    resetFails(); S.unlocked=true; $('fRecover').value=''; showLock('set1');
    setSub('Mở khoá thành công. Đặt mã PIN mới');
  } else { registerFail(); setSub('Mã khôi phục không đúng', true); }
}
let hiddenAt=0;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ hiddenAt=Date.now(); return; }
  try{ applyRecurring(); }catch(e){}
  if(pinOn() && S.unlocked && hiddenAt && Date.now()-hiddenAt > RELOCK_MS){ S.unlocked=false; render(); }
});

// ---------- Sao lưu & khôi phục ----------
function lastBackup(){ try{ return Number(localStorage.getItem('sothuchi.lastBackup'))||0; }catch(e){ return 0; } }
function markBackup(){ try{ localStorage.setItem('sothuchi.lastBackup', String(Date.now())); }catch(e){} }
function backupJSON(){
  return JSON.stringify({ app:'sothuchi', v:1, exportedAt:new Date().toISOString(), months:S.months,
    settings:{ ...S.settings, pin:null } });
}
async function doBackup(){
  const json = backupJSON(), name = 'thuchi-saoluu-'+ymd(new Date())+'.json';
  if(STANDALONE){
    try{
      const file = new File([json], name, {type:'application/json'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({ files:[file], title:'Sao lưu Sổ Thu Chi' });
        markBackup(); renderSettings(); render(); toast('Đã sao lưu'); return;
      }
      const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); a.remove();
      markBackup(); renderSettings(); render(); toast('Đã tải file sao lưu'); return;
    }catch(e){ if(e && e.name==='AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(json); markBackup(); renderSettings(); render(); toast('Đã sao chép — dán vào Ghi chú để giữ lại'); }
  catch(e){ toast('Không sao lưu được trên trình duyệt này'); }
}
let restoreArm=false;
async function doRestore(){
  let txt = ($('fRestoreText').value||'').trim();
  const f = $('fRestoreFile').files && $('fRestoreFile').files[0];
  if(!txt && f){ try{ txt = await f.text(); }catch(e){} }
  let o=null; try{ o=JSON.parse(txt); }catch(e){}
  if(!o || o.app!=='sothuchi' || typeof o.months!=='object'){ toast('File sao lưu không hợp lệ'); return; }
  if(!restoreArm){ restoreArm=true; $('restoreBtn').textContent='Chạm lần nữa để thay toàn bộ dữ liệu'; $('restoreBtn').style.background='var(--exp)'; return; }
  restoreArm=false;
  const months={}; let n=0;
  for(const k in o.months){ if(/^\d{4}-\d{2}$/.test(k) && o.months[k] && Array.isArray(o.months[k].tx)){
    months[k]={ tx:o.months[k].tx.filter(t=>t && t.id && (t.type==='income'||t.type==='expense'||t.type==='transfer') && Number(t.amount)>0 && /^\d{4}-\d{2}-\d{2}$/.test(t.date)) }; n+=months[k].tx.length; } }
  const oldKeys = Object.keys(S.months);
  S.months = months;
  S.settings = { ...normSettings({ ...(o.settings||{}), pin:null }), pin:S.settings.pin };
  if(S.mode==='db'){ for(const k of new Set(oldKeys.concat(Object.keys(months)))) persist('m-'+k); persist('settings'); }
  else saveLocal();
  applyRecurring(); closeSheets(); render(); toast('Đã khôi phục '+n+' khoản');
}

// ---------- Toast ----------
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

// ---------- Sự kiện ----------
function shiftMonth(d){ const [y,m]=S.cur.split('-').map(Number); S.cur = mkey(new Date(y, m-1+d, 1)); S.selDay=null; S.filter=null; render(); }
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  switch(a){
    case 'prev': shiftMonth(-1); break;
    case 'next': shiftMonth(1); break;
    case 'tab': S.tab=v; if(v!=='journal') S.filter=null; render(); break;
    case 'brk': S.brk=v; S.selDay=null; render(); break;
    case 'selday': { const d=Number(v); S.selDay = S.selDay===d?null:d; render(); break; }
    case 'pickcat': S.filter={kind:'cat',type:b.dataset.t,id:v}; S.tab='journal'; render(); window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'pickwallet': S.filter={kind:'wallet',id:v}; S.tab='journal'; render(); break;
    case 'unfilter': S.filter=null; render(); break;
    case 'search': openSearch(); break;
    case 'srange': SR.range=v; renderSearch(); break;
    case 'wsel': if(b.dataset.t==='w') F.wallet=v; else if(b.dataset.t==='from') F.from=v; else F.to=v; paintType(); break;
    case 'recstop': { const r=ruleOf(v); if(r){ updRule(v, r.paused ? {paused:false, start:mkey(new Date())} : {paused:true}); toast(r.paused?'Đã tiếp tục lặp lại':'Đã dừng lặp lại'); if(r.paused) applyRecurring(); } if($('txSheet').classList.contains('show')) paintType(); else { renderSettings(); render(); } break; }
    case 'recform': openForm('rec', v); break;
    case 'walletform': openForm('wallet', v); break;
    case 'cbform': openForm('catbudget', v); break;
    case 'goalform': openForm('goal', v); break;
    case 'goalmove': openForm('goalmove', v, b.dataset.t); break;
    case 'emoji': FM.ic=v; b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); break;
    case 'fmplus': { const i=$('fmAmt'); i.value=fmtNum(mval('fmAmt')+Number(v)); break; }
    case 'fsave': saveForm(); break;
    case 'fdel': delForm(); break;
    case 'add': if(!S.loading) openTx(null); break;
    case 'edit': { const f = findTx(v); if(f) openTx(f.t); break; }
    case 'close': closeSheets(); break;
    case 'type': if(F.type!==v){ F.type=v; F.cat=null; } paintType(); break;
    case 'cat': F.cat=v; paintType(); $('fErr').textContent=''; break;
    case 'plus': if(v==='clear') $('fAmt').value=''; else if(v==='000') setAmt(amtVal()*1000); else setAmt(amtVal()+Number(v)); break;
    case 'day': { const d=new Date(); d.setDate(d.getDate()+Number(v)); $('fDate').value=ymd(d); break; }
    case 'save': saveTx(); break;
    case 'del': delTx(); break;
    case 'settings': renderSettings(); openSheet('setSheet'); break;
    case 'savebudget': { const n=Number(($('fBudget').value||'').replace(/\D/g,''))||0; S.settings={...S.settings,budget:n}; persist('settings'); render(); toast(n?'Đã đặt ngân sách '+fmt(n):'Đã bỏ ngân sách'); break; }
    case 'addcat': addCat(b.dataset.t); break;
    case 'rmcat': rmCat(b.dataset.t, v); break;
    case 'csv': copyCSV(); break;
    case 'backup': doBackup(); break;
    case 'restoreopen': restoreArm=false; $('restoreBox').hidden=false; break;
    case 'restore': doRestore(); break;
    case 'key': if(L.buf.length<PIN_LEN && !(lockedOut() && (L.mode==='unlock'||L.mode==='verify'))){ L.buf+=v; paintDots(); if(L.buf.length===PIN_LEN) setTimeout(onFullPin, 120); } break;
    case 'bk': L.buf=L.buf.slice(0,-1); paintDots(); break;
    case 'lkcancel': if(L.mode!=='unlock'){ hideLock(); render(); } break;
    case 'forgot': view('recover'); $('lkTitle').textContent='Nhập mã khôi phục'; setSub('Mã 8 ký tự bạn đã lưu khi bật khoá'); break;
    case 'recoverback': showLock(L.mode||'unlock'); break;
    case 'recover': tryRecover(); break;
    case 'copycode': navigator.clipboard.writeText($('rcode').textContent).then(()=>toast('Đã sao chép mã khôi phục'),()=>toast('Không sao chép được, hãy chụp màn hình')); break;
    case 'codeok': hideLock(); render(); toast('Đã bật khoá mã PIN'); break;
    case 'pinon': showLock('set1'); break;
    case 'pinchange': showLock('verify','change'); break;
    case 'pinoff': showLock('verify','off'); break;
    case 'locknow': S.unlocked=false; closeSheets(); render(); break;
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target && e.target.id==='fRecover'){ e.preventDefault(); tryRecover(); return; }
  if(e.key==='Enter' && e.target && e.target.id && e.target.id.startsWith('nc_')){ e.preventDefault(); addCat(e.target.id.slice(3)); }
});
init();
</script>
